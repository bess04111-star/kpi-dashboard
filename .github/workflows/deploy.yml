name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 當推送到 main 分支時觸發

  # 允許在 GitHub 頁面上手動觸發部署
  workflow_dispatch:

# 設定 GitHub Token 的寫入權限，用於發布至 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 確保同一時間只有一個部署流程在執行
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 檢出程式碼 (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ 自動生成 config.js（防字串衝突安全版）
        run: |
          node -e "
            const fs = require('fs');
            const url = process.env.GOOGLE_API_URL || '';
            const token = process.env.API_SECRET_TOKEN || '';
            const content = \`window.GOOGLE_API_URL = \${JSON.stringify(url)};\nwindow.API_SECRET_TOKEN = \${JSON.stringify(token)};\`;
            fs.writeFileSync('config.js', content);
          "
          echo "✅ js 安全生成成功！"
        env:
          GOOGLE_API_URL: ${{ secrets.GOOGLE_API_URL }}
          API_SECRET_TOKEN: ${{ secrets.API_SECRET_TOKEN }}

      - name: 🔧 設定 GitHub Pages 資源環境
        uses: actions/configure-pages@v5

      - name: 📦 上傳靜態檔案構建 (Upload Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
